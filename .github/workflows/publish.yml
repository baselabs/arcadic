name: Publish to Hex.pm

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full lowercase SHA of the landed release commit
        required: true
        type: string
      qualification_run:
        description: Original qualification run ID when retrying a release
        required: false
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  HEX_PIN_URL: https://raw.githubusercontent.com/baselabs/.github/3bfbb84692a65b4d2c03dc3b7932353026fe6943/.github/actions/hex-publish/hex-version

defaults:
  run:
    shell: bash

jobs:
  upload:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # no green run yet
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      version: ${{ steps.hex.outputs.version }}
      qualification-run: ${{ steps.hex.outputs.qualification-run }}
      qualification-sha256: ${{ steps.hex.outputs.qualification-sha256 }}
    steps:
      - name: Require the default branch and a full release commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] ||
            { echo 'Dispatch publish.yml from the default branch'; exit 1; }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
            { echo 'release_commit must be a full lowercase commit SHA'; exit 1; }

      - &checkout
        name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - &read_toolchain
        name: Read the release commit's toolchain
        id: versions
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git show "$WORKFLOW_SHA:scripts/toolchain.sh" > "$RUNNER_TEMP/toolchain.sh"
          chmod 755 "$RUNNER_TEMP/toolchain.sh"
          "$RUNNER_TEMP/toolchain.sh" .tool-versions >> "$GITHUB_OUTPUT"

      - &setup_beam
        name: Install the exact BEAM runtime
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}
          version-type: strict
          install-hex: false
          install-rebar: false

      - &install_hex
        name: Verify BEAM and install the shared action's Hex client
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ELIXIR: ${{ steps.versions.outputs.elixir }}
          EXPECTED_OTP: ${{ steps.versions.outputs.otp }}
        run: |
          ./toolchain.sh --installed "elixir=$EXPECTED_ELIXIR" "erlang=$EXPECTED_OTP"
          test ! -e mix.exs
          hex_version="$(curl --max-time 60 -fsSL --retry 3 --retry-all-errors "$HEX_PIN_URL")"
          [[ "$hex_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mix local.hex "$hex_version" --force

      - name: Upload the qualified archives
        id: hex
        uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        with:
          operation: upload
          package: arcadic
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ inputs.qualification_run }}
          organization-read-key: ${{ secrets.HEX_ORG_KEY_PUBLISH_API_READ }}

  read-back:
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # no green run yet
    permissions:
      contents: read
      actions: read
    steps:
      - *checkout
      - *read_toolchain
      - *setup_beam
      - *install_hex

      - name: Verify the archives served by Hex
        id: hex
        uses: baselabs/.github/.github/actions/hex-publish@3bfbb84692a65b4d2c03dc3b7932353026fe6943
        with:
          operation: read-back
          package: arcadic
          package-directory: .
          release-commit: ${{ inputs.release_commit }}
          qualification-run: ${{ needs.upload.outputs.qualification-run }}
          qualification-sha256: ${{ needs.upload.outputs.qualification-sha256 }}
          release-assets-directory: ${{ runner.temp }}/release-assets

      - name: Write release notes from the published commit
        env:
          PUBLISHED_COMMIT: ${{ steps.hex.outputs.commit }}
          VERSION: ${{ needs.upload.outputs.version }}
        run: |
          [[ "$PUBLISHED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git show "$PUBLISHED_COMMIT:CHANGELOG.md" | python3 -I -c '
          import re, sys

          version = sys.argv[1]
          text = sys.stdin.read()
          headings = list(re.finditer(r"^##[ \t]+(.+)$", text, re.MULTILINE))
          for index, heading in enumerate(headings):
              title = heading.group(1).split(maxsplit=1)
              if title and title[0] in (f"[{version}]", version):
                  end = headings[index + 1].start() if index + 1 < len(headings) else len(text)
                  print(text[heading.start():end].rstrip())
                  break
          else:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          ' "$VERSION" > "$RUNNER_TEMP/release-assets/RELEASE_NOTES.md"

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
