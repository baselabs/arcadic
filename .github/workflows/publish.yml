name: Publish to Hex.pm

# Infra dispatches this from the default branch after the version commit has landed,
# then tags v<version> on the published commit. It starts no qualification job.
on:
  workflow_dispatch:

env:
  MIX_ENV: dev

jobs:
  publish:
    name: Publish
    # The Hex key lives only in the protected publish environment, and only an
    # owner's dispatch from the default branch, and re-run if at all, may use it.
    if: contains(fromJSON('["corepay","palermo-git"]'), github.actor) && contains(fromJSON('["corepay","palermo-git"]'), github.triggering_actor)
    environment: publish
    runs-on: ubuntu-24.04
    # 2x 1.1 min, run 44153465664
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Require the default branch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$DISPATCH_REF" != "$DEFAULT_REF" ]; then
            echo "::error::Publish requires $DEFAULT_REF; received $DISPATCH_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the default toolchain
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      - run: mix deps.get --check-locked

      - name: Refuse an existing release
        env:
          PACKAGE_NAME: arcadic
        run: |
          VERSION=$(mix run --no-start --no-compile --no-deps-check -e 'IO.puts(Mix.Project.config()[:version])')
          export VERSION
          sh scripts/check-release-version.sh
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - run: mix docs --warnings-as-errors

      - name: Build and inspect the package
        run: |
          mix hex.build --unpack --output "$RUNNER_TEMP/package"
          elixir scripts/inspect_package.exs "$RUNNER_TEMP/package"

      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
