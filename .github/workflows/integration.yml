name: Live integration

# The live ArcadeDB lanes (HTTP, WebSocket, time-series, Bolt, gRPC, both TLS listeners,
# shutdown) and every notebook the package ships, shared by two callers: ci.yml runs them against a digest-pinned image so a
# landing's verdict is reproducible, and canary.yml runs them against the moving `latest`
# image so upstream drift surfaces before the next deliberate pin bump.
on:
  workflow_call:
    inputs:
      image:
        description: ArcadeDB image reference (tag, or tag@digest)
        required: true
        type: string

permissions:
  contents: read

# Every run step is bash -eo pipefail: a failure behind a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  lanes:
    name: lanes
    runs-on: ubuntu-24.04
    # 2x 1.9 min, run 44158069926, raised to the 5 min floor
    timeout-minutes: 5 # 117 s, run 44158069926
    env:
      PW: probe-test-pw
      ARCADEDB_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      # The vendor and the exact version and build both come from .tool-versions.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .tool-versions

      - name: Verify installed Java
        env:
          EXPECTED_JAVA: ${{ steps.versions.outputs.java }}
        run: |
          case "$EXPECTED_JAVA" in
            temurin-*) expected_vendor="Eclipse Adoptium" ;;
            *) echo "::error::Java: no vendor check for $EXPECTED_JAVA" >&2; exit 1 ;;
          esac
          expected=${EXPECTED_JAVA#temurin-}
          vendor=$(sed -n 's/^IMPLEMENTOR="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          actual=$(sed -n 's/^JAVA_RUNTIME_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          # Temurin appends its LTS designation after the exact version and build.
          actual=${actual%-LTS}
          if [ "$vendor" != "$expected_vendor" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Java: expected $expected_vendor $expected, installed $vendor $actual" >&2
            exit 1
          fi
          echo "Java $vendor $actual"

      # Restore only: cache-warmer.yml on the default branch is the one writer.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.versions.outputs.otp }}-${{ steps.versions.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.versions.outputs.otp }}-${{ steps.versions.outputs.elixir }}-

      - run: mix deps.get --check-locked

      - name: Generate throwaway TLS material
        run: test/support/tls/gen-grpc-certs.sh /tmp/arcadic-tls

      # Fixed host ports stay below 32768. Each gRPC container publishes on a host port Docker
      # picks: a fixed port in Linux's ephemeral range (32768-60999), such as 50051, can already
      # be held by a client socket an earlier step left open, and the bind then fails.
      - name: Start ArcadeDB (HTTP + Bolt + gRPC, plaintext)
        run: |
          docker run -d --name arcadic-main \
            -p 2480:2480 -p 7687:7687 -p 50051 \
            -e JAVA_OPTS="-Darcadedb.server.rootPassword=$PW \
              -Darcadedb.server.defaultDatabases=probe[root] \
              -Darcadedb.server.plugins=GRPC:com.arcadedb.server.grpc.GrpcServerPlugin,Bolt:com.arcadedb.bolt.BoltProtocolPlugin \
              -Darcadedb.grpc.enabled=true -Darcadedb.grpc.port=50051" \
            "$ARCADEDB_IMAGE"
          ports=$(docker port arcadic-main 50051/tcp)
          GRPC_PORT=$(sed -n '1s/.*://p' <<< "$ports")
          if [ -z "$GRPC_PORT" ]; then echo "::error::no host port for gRPC" >&2; exit 1; fi
          echo "GRPC_PORT=$GRPC_PORT" >> "$GITHUB_ENV"
          for _ in {1..60}; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u "root:$PW" http://localhost:2480/api/v1/ready)" = "204" ] && exit 0
            sleep 2
          done
          docker logs arcadic-main && exit 1

      - name: Report the ArcadeDB version under test
        run: |
          server=$(curl -sS --fail -u "root:$PW" "http://localhost:2480/api/v1/server?mode=basic")
          python3 -c 'import json,sys; print("ArcadeDB", json.load(sys.stdin).get("version"))' <<< "$server"

      - name: HTTP-family suites (integration, ws, ts, reliability)
        run: mix test --warnings-as-errors --only integration
        env:
          ARCADIC_TEST_URL: http://localhost:2480
          ARCADIC_TEST_PASSWORD: ${{ env.PW }}
      - run: mix test --warnings-as-errors --only integration_ws
        env:
          ARCADIC_TEST_URL: http://localhost:2480
          ARCADIC_TEST_PASSWORD: ${{ env.PW }}
      - run: mix test --warnings-as-errors --only integration_ts
        env:
          ARCADIC_TS_TEST_URL: http://localhost:2480
          ARCADIC_TS_TEST_PASSWORD: ${{ env.PW }}

      - name: Bolt suites (both env families)
        run: mix test --warnings-as-errors --only integration_bolt
        env:
          ARCADIC_BOLT_HOST: localhost
          ARCADIC_BOLT_PORT: "7687"
          ARCADIC_BOLT_HTTP_PORT: "2480"
          ARCADIC_BOLT_PASSWORD: ${{ env.PW }}
          ARCADIC_TEST_BOLT_HOST: localhost
          ARCADIC_TEST_BOLT_PORT: "7687"
          ARCADIC_TEST_URL: http://localhost:2480
          ARCADIC_TEST_PASSWORD: ${{ env.PW }}

      - name: gRPC suite
        run: mix test --warnings-as-errors --only integration_grpc
        env:
          ARCADIC_GRPC_TEST_URL: grpc://localhost:${{ env.GRPC_PORT }}
          ARCADIC_GRPC_TEST_HTTP_URL: http://localhost:2480
          ARCADIC_GRPC_TEST_PASSWORD: ${{ env.PW }}

      - name: Start ArcadeDB (gRPC TLS)
        run: |
          # NOTE: no noOpenSsl override here — netty-tcnative's crash is an ARM64
          # LSE-atomics bug; on amd64 runners the native OpenSSL path is the
          # normal one (and JDK-SSL forced TLS has not been proven against the
          # BEAM client on this platform).
          docker run -d --name arcadic-grpc-tls -p 50051 \
            -v /tmp/arcadic-tls:/certs:ro \
            -e JAVA_OPTS="-Darcadedb.server.rootPassword=$PW \
              -Darcadedb.server.defaultDatabases=probe[root] \
              -Darcadedb.server.plugins=GRPC:com.arcadedb.server.grpc.GrpcServerPlugin \
              -Darcadedb.grpc.enabled=true -Darcadedb.grpc.port=50051 \
              -Darcadedb.grpc.tls.enabled=true \
              -Darcadedb.grpc.tls.cert=/certs/server.crt -Darcadedb.grpc.tls.key=/certs/server.key" \
            "$ARCADEDB_IMAGE"
          ports=$(docker port arcadic-grpc-tls 50051/tcp)
          GRPC_TLS_PORT=$(sed -n '1s/.*://p' <<< "$ports")
          if [ -z "$GRPC_TLS_PORT" ]; then echo "::error::no host port for gRPC TLS" >&2; exit 1; fi
          echo "GRPC_TLS_PORT=$GRPC_TLS_PORT" >> "$GITHUB_ENV"
          # CAUTION: openssl prints "Verify return code: 0 (ok)" even when NO cert was
          # received (no-verify-error state), so the gate must also require a completed
          # handshake — "Cipher is (NONE)" means the server never answered.
          for _ in {1..60}; do
            echo | openssl s_client -connect "localhost:$GRPC_TLS_PORT" -servername localhost \
              -CAfile /tmp/arcadic-tls/ca.crt -verify_return_error 2>/dev/null \
              | awk '/Cipher is \(NONE\)/ {bad=1} /Verify return code: 0/ {ok=1} END {exit !(ok && !bad)}' \
              && exit 0
            sleep 2
          done
          docker logs arcadic-grpc-tls && exit 1

      - name: gRPC TLS suite (fail-closed)
        run: mix test --warnings-as-errors --only integration_grpc_tls
        env:
          ARCADIC_GRPC_TLS_TEST_URL: grpcs://localhost:${{ env.GRPC_TLS_PORT }}
          ARCADIC_GRPC_TLS_TEST_CACERT: /tmp/arcadic-tls/ca.crt
          ARCADIC_GRPC_TLS_TEST_UNTRUSTED_CACERT: /tmp/arcadic-tls/untrusted.crt
          ARCADIC_GRPC_TLS_TEST_PASSWORD: ${{ env.PW }}

      - name: Start ArcadeDB (Bolt TLS)
        run: |
          docker run -d --name arcadic-bolt-tls -p 7688:7687 -p 2481:2480 \
            -v /tmp/arcadic-tls:/certs:ro \
            -e JAVA_OPTS="-Darcadedb.server.rootPassword=$PW \
              -Darcadedb.server.defaultDatabases=s3_tls_probe[root] \
              -Darcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin \
              -Darcadedb.bolt.ssl=REQUIRED \
              -Darcadedb.ssl.keyStore=/certs/server.p12 \
              -Darcadedb.ssl.keyStorePassword=arcadic-tls-test \
              -Darcadedb.ssl.trustStore=/certs/truststore.jks \
              -Darcadedb.ssl.trustStorePassword=arcadic-tls-test" \
            "$ARCADEDB_IMAGE"
          # The Bolt plugin starts BEFORE_HTTP_ON, so HTTP readiness implies the
          # TLS Bolt listener is up.
          for _ in {1..60}; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u "root:$PW" http://localhost:2481/api/v1/ready)" = "204" ] && exit 0
            sleep 2
          done
          docker logs arcadic-bolt-tls && exit 1

      - name: Bolt TLS suite (fail-closed)
        run: mix test --warnings-as-errors --only integration_bolt_tls
        env:
          ARCADIC_TEST_BOLT_TLS_HOST: localhost
          ARCADIC_TEST_BOLT_TLS_PORT: "7688"
          ARCADIC_TEST_BOLT_TLS_CACERT: /tmp/arcadic-tls/ca.crt
          ARCADIC_TEST_URL: http://localhost:2481
          ARCADIC_TEST_PASSWORD: ${{ env.PW }}

      - name: Shutdown suite (halts its own throwaway server)
        run: |
          docker run -d --name arcadic-shutdown -p 2482:2480 \
            -e JAVA_OPTS="-Darcadedb.server.rootPassword=$PW" \
            "$ARCADEDB_IMAGE"
          for _ in {1..60}; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u "root:$PW" http://localhost:2482/api/v1/ready)" = "204" ] && break
            sleep 2
          done
          mix test --warnings-as-errors --only integration_shutdown
        env:
          ARCADIC_SHUTDOWN_TEST_URL: http://localhost:2482
          ARCADIC_SHUTDOWN_TEST_PASSWORD: ${{ env.PW }}
          ARCADIC_TEST_URL: http://localhost:2480

  # Every notebook the Hex package ships runs top to bottom against this checkout and a live
  # server. The list comes from the built package, so a new notebook is covered with no edit
  # here; a tracked notebook the package leaves out, or one with no elixir cells, fails.
  notebooks:
    name: notebooks
    runs-on: ubuntu-24.04
    # 2x 1.1 min, run 44122846610, raised to the 5 min floor
    timeout-minutes: 5 # 64 s, run 44122846610
    env:
      PW: probe-test-pw
      ARCADEDB_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the default toolchain
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ steps.versions.outputs.elixir }}
          otp-version: ${{ steps.versions.outputs.otp }}

      # No cache: each notebook builds in its own Mix.install project, and this checkout's deps
      # are fetched only to build the package.
      - run: mix deps.get --check-locked

      - name: Build and inspect the package and list its notebooks
        run: |
          VERSION=$(mix run --no-start --no-compile --no-deps-check -e 'IO.puts(Mix.Project.config()[:version])')
          export VERSION
          mix hex.build --unpack --output "$RUNNER_TEMP/package"
          elixir scripts/inspect_package.exs "$RUNNER_TEMP/package" "$RUNNER_TEMP/package/hex_metadata.config"
          (cd "$RUNNER_TEMP/package" && find . -name '*.livemd' | sed 's|^\./||' | sort) > "$RUNNER_TEMP/shipped"
          git ls-files '*.livemd' | sort > "$RUNNER_TEMP/tracked"
          unshipped=$(comm -23 "$RUNNER_TEMP/tracked" "$RUNNER_TEMP/shipped")
          if [ -n "$unshipped" ]; then
            echo "Notebooks the package does not ship:"; echo "$unshipped"; exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/shipped" ]; then
            echo "The package ships no notebooks"; exit 1
          fi
          cat "$RUNNER_TEMP/shipped"

      # The union of what the notebooks' own setup recipes start: HTTP, the Bolt plugin
      # (getting_started), and local-file restore (operations).
      - name: Start ArcadeDB (HTTP + Bolt, local-file restore)
        run: |
          docker run -d --name arcadic-notebooks -p 2480:2480 -p 7687:7687 \
            -e JAVA_OPTS="-Darcadedb.server.rootPassword=$PW \
              -Darcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin \
              -Darcadedb.server.restoreImportAllowLocalUrls=true" \
            "$ARCADEDB_IMAGE"
          for _ in {1..60}; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -u "root:$PW" http://localhost:2480/api/v1/ready)" = "204" ] && exit 0
            sleep 2
          done
          docker logs arcadic-notebooks && exit 1

      - name: Run every shipped notebook
        env:
          ARCADIC_HTTP_URL: http://localhost:2480
          ARCADIC_PASSWORD: ${{ env.PW }}
          ARCADIC_BOLT_HOST: localhost
          ARCADIC_BOLT_PORT: "7687"
        run: |
          failed=""
          while read -r notebook; do
            echo "::group::$notebook"
            elixir scripts/run_notebook.exs "$notebook" < /dev/null || failed="$failed $notebook"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/shipped"
          if [ -n "$failed" ]; then
            echo "Failed notebooks:$failed"; exit 1
          fi
