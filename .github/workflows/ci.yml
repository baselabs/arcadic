name: CI

# One qualification run per landing candidate: the candidate commit is pushed to `kci/<sha>`,
# the `qualified` job below is its verdict, and only then does main move to it. Nothing else
# starts this workflow; the ArcadeDB `latest` drift canary lives in canary.yml on a schedule.
#
# Supply-chain posture: third-party action code is pinned by commit SHA, and the ArcadeDB
# image by tag and digest (mutable tags can be retargeted under us). Bump the image pin
# deliberately, after the canary has run the new release green.
on:
  push:
    branches: ['kci/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step is bash -eo pipefail: a failure behind a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  # .tool-versions is the only home for runtime versions: its first version of each tool is
  # the default every job below runs on, and every other listed Elixir build, paired with
  # its Erlang by OTP major, is a compatibility lane.
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    # floor 5 min for runner start-up; slowest green 0.2 min, run 44120279901
    timeout-minutes: 5 # 14 s, run 44504139800
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      beam_lanes: ${{ steps.versions.outputs.beam_lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read defaults and compatibility lanes
        id: versions
        run: sh scripts/toolchain.sh >> "$GITHUB_OUTPUT"

  unit:
    name: "unit + static (Elixir ${{ needs.toolchain.outputs.elixir }} / OTP ${{ needs.toolchain.outputs.otp }})"
    needs: toolchain
    runs-on: ubuntu-24.04
    # 2x 4.5 min, run 44120279901
    timeout-minutes: 9 # 270 s, run 44120279901
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      # Restore only: cache-warmer.yml on the default branch is the one writer.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-

      - name: Restore the PLT
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-

      - run: mix deps.get --check-locked

      # Formatter output is Elixir-version-dependent; the default toolchain's is canonical.
      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - run: mix credo --strict

      - run: mix audit

      - run: mix test --warnings-as-errors

      - run: mix dialyzer

  compat:
    name: "unit (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})"
    needs: toolchain
    # OTP 26 (the documented floor) has no ubuntu-24.04 build; its lane runs on 22.04.
    runs-on: ${{ startsWith(matrix.otp, '26.') && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    # 2x 2.0 min, run 44152257276, raised to the 5 min floor
    timeout-minutes: 5 # 121 s, run 44152257276
    # A compatibility lane builds what a consumer's test suite builds on that Elixir. Dev-only
    # tools and the dependency audit, which reads only mix.lock, run on the default toolchain.
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.toolchain.outputs.beam_lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Restore only: cache-warmer.yml on the default branch is the one writer.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get --check-locked

      - run: mix compile --warnings-as-errors

      - run: mix credo --strict

      - run: mix test --warnings-as-errors

  integration:
    name: live integration (ArcadeDB 26.11.1)
    uses: ./.github/workflows/integration.yml
    with:
      image: arcadedata/arcadedb:26.11.1@sha256:22a049898f34f01c256b56a1ba95fb01d32e5e14755d3c4367415c8e55ae5035

  # The release builds these docs; a warning here would ship on hexdocs.
  # Qualification builds and inspects the same archives as publication: a reproducible
  # package and one docs build.
  release-archives:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 56 s, run 44702660118
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/beam
        with:
          elixir-version: ${{ needs.toolchain.outputs.elixir }}
          otp-version: ${{ needs.toolchain.outputs.otp }}

      - name: Install the archive-building Hex client
        run: mix local.hex "$(cat scripts/release/hex-version)" --force

      # The warmer writes deps and both test and dev _build for the default toolchain.
      - name: Restore deps and _build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ needs.toolchain.outputs.otp }}-${{ needs.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get --check-locked

      - name: Test the release scripts
        run: python3 -I -B -m unittest discover -s scripts/release -p '*_test.py' -v

      - name: Build and inspect the release archives
        run: scripts/release/build_archives.sh "$RUNNER_TEMP/release"

  qualified:
    if: always()
    needs: [toolchain, unit, compat, integration, release-archives]
    runs-on: ubuntu-24.04
    # floor 5 min for runner start-up; slowest green 0.1 min, run 44160534612
    timeout-minutes: 5 # 7 s, run 44160534612
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
