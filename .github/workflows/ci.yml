name: CI

# One qualification run per landing candidate: the candidate commit is pushed to `kci/<sha>`,
# the `qualified` job below is its verdict, and only then does main move to it. Nothing else
# starts this workflow; the ArcadeDB `latest` drift canary lives in canary.yml on a schedule.
#
# Supply-chain posture: third-party action code is pinned by commit SHA, and the ArcadeDB
# image by tag and digest (mutable tags can be retargeted under us). Bump the image pin
# deliberately, after the canary has run the new release green.
on:
  push:
    branches: ['kci/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: "unit + static (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20"
            otp: "29"
            dialyzer: true
            format: true
          - elixir: "1.15"
            otp: "27"
            dialyzer: false
            format: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: deps
          key: deps-${{ runner.os }}-elixir${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - name: Restore PLT cache
        if: matrix.dialyzer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-elixir${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      # Formatter output is Elixir-version-dependent; the canonical form is the
      # dev toolchain's (1.20.x), so the floor cell skips the format gate.
      - run: mix format --check-formatted
        if: matrix.format

      - run: mix compile --warnings-as-errors

      - run: mix credo --strict

      - run: mix audit

      - run: mix test

      - run: mix dialyzer
        if: matrix.dialyzer

  integration:
    name: live integration (ArcadeDB 26.11.1)
    uses: ./.github/workflows/integration.yml
    with:
      image: arcadedata/arcadedb:26.11.1@sha256:22a049898f34f01c256b56a1ba95fb01d32e5e14755d3c4367415c8e55ae5035

  qualified:
    if: always()
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Qualification refused: ' + ', '.join(failed))
          sys.exit(bool(failed) or not results)
          PY
